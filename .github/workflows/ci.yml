name: Validar build (CI)

# Roda o build em todo PR: conteúdo com frontmatter inválido (campo faltando,
# questão sem 5 alternativas etc.) é barrado aqui antes de chegar na main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o gitleaks
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Segredos no histórico inteiro (a action só olha o intervalo do PR).
      - name: gitleaks (histórico completo)
        run: |
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --redact --no-banner --exit-code 2
      # Falha em achado alto ou crítico nas dependências de produção; os moderados ficam em docs/VERIFICACAO.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --prefix scripts
      # Regras de estudo (estados, fila de revisão, sugestões do Hoje): src/lib/estudo.test.ts.
      - run: npm test
      # Confere estrutura e marcação das aulas. O banco local do INEP não vai para
      # a CI, então a comparação com prova e gabarito continua sendo feita na máquina
      # que mantém o acervo.
      - run: node scripts/validar-aula.mjs src/content/enem
      - run: npm run build
        env:
          BASE_PATH: /caderno-de-estudos
      - run: node scripts/checar-quiz.mjs $(find src/content/enem -name '*.mdx')
      # Acessibilidade: o contraste lê os tokens de src/styles/global.css; o verificador
      # do HTML usa o jsdom da pasta scripts/. Ver docs/acessibilidade.md.
      - run: node scripts/checar-contraste.mjs
      - run: node scripts/checar-acessibilidade.mjs --base /caderno-de-estudos
